[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-qa-engine"
version = "0.1.0"
description = "RAG Q&A Engine - Document Q&A API with vector search and streaming responses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "asyncpg>=0.29.0",
    "anthropic>=0.25.0",
    "voyageai>=0.2.0",
    "numpy>=1.24.0",
    "pdfplumber>=0.10.0",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]
