[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "rag-qa-engine"
version = "0.1.0"
description = "Production RAG Q&A engine with Voyage embeddings and Claude streaming"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "asyncpg>=0.29.0",
    "anthropic>=0.25.0",
    "voyageai>=0.2.0",
    "tiktoken>=0.5.0",
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pdf = ["markitdown[pdf]>=0.0.7"]
dev = ["black", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
